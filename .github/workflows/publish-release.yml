name: Build and Release (win-x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file EXE (win-x64)
        run: |
          dotnet publish "MACH Cal/MACH Cal.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create zip
        run: |
          cd publish
          zip -r ../MACH_Cal-${{ github.ref_name }}-win-x64.zip *

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated build for ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./MACH_Cal-${{ github.ref_name }}-win-x64.zip
          asset_name: MACH_Cal-${{ github.ref_name }}-win-x64.zip
          asset_content_type: application/zip
